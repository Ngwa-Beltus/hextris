namespace: hextris

replicaCount: 2

image:
  repository: beltus325/hextris
  tag: latest
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "500Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: hextris.rgfdevops.cloud
  tls:
    enabled: true
    secretName: hextris-api-tls-secret
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

nginxIngressController:
  enabled: true
  image: quay.io/kubernetes-ingress-controller/nginx-ingress-controller:0.21.0
  replicas: 1

serviceAccount:
  name: jenkins-sa

rbac:
  enabled: true
  clusterRole: cluster-admin
